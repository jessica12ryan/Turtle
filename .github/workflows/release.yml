name: Create Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3). Leave empty to auto-increment patch.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ha_bases: ${{ steps.ha_bases.outputs.bases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VER="${INPUT_VERSION#v}"
            if [[ "${VER}" == *$'\n'* || "${VER}" == *$'\r'* ]] || ! [[ "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version — expected e.g. 1.2.3" >&2
              exit 1
            fi
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            LATEST="${LATEST#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            : "${MAJOR:=0}" "${MINOR:=0}" "${PATCH:=0}"
            echo "version=${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve HA base images
        id: ha_bases
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          with open('turtle-ha/build.yaml', encoding='utf-8') as fh:
              bases = dict(
                  (m.group(1), m.group(2))
                  for m in re.finditer(r'^\s*(aarch64|amd64|armv7):\s*(\S+)', fh.read(), re.M)
              )
          if set(bases) != {'aarch64', 'amd64', 'armv7'}:
              raise SystemExit('build.yaml must define all three HA base images')
          print('bases=' + json.dumps(bases))
          PY

      - name: Update turtle-ha/config.yaml version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version:.*/version: \"${VERSION}\"/" turtle-ha/config.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add turtle-ha/config.yaml
          git diff --staged --quiet || git commit -m "chore: bump HA add-on version to ${VERSION}"
          git push origin HEAD

      - name: Get Commits Since Last Tag
        id: git_history
        run: |
          # Fetch the latest tag name, ignoring the current one if it was just pushed
          LATEST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            # If no previous tag exists, get all commits
            COMMITS=$(git log --oneline)
          else
            # Get all commits between the last tag and current HEAD
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline)
          fi
          
          # Save the multiline string to the GitHub Action environment variable
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Update stable branch
        run: |
          git branch -f stable HEAD
          git push origin stable

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Turtle v${{ steps.version.outputs.version }}"
          body: |
            ## Turtle - Tenant Management Portal
            
            ### How to use
            See [README.md](../../blob/master/README.md) for installation instructions.
            
            ### Changes
            ${{ steps.git_history.outputs.changelog }}

  build-ha-addon:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - uses: actions/checkout@v7
        with:
          ref: "v${{ needs.release.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./turtle-ha
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ fromJSON(needs.release.outputs.ha_bases)[matrix.arch] }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/jessica12ryan/turtle/${{ matrix.arch }}:${{ needs.release.outputs.version }}
            ghcr.io/jessica12ryan/turtle/${{ matrix.arch }}:latest
