services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - turtle-storage:/var/www/html/storage/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - turtle

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-turtle}
      - MYSQL_USER=${MYSQL_USER:-turtle}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-turtle}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      retries: 10
      timeout: 5s
    networks:
      - turtle

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - turtle

volumes:
  mysql-data:
  turtle-storage:

networks:
  turtle:
    driver: bridge
