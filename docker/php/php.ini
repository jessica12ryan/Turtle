upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
memory_limit = 256M
max_file_uploads = 50
date.timezone = UTC
; Write PHP errors into the persistent repo mount so Settings -> Logging can
; display them (the default sends them to Apache stderr / container stdout).
error_log = /var/www/html/storage/logs/php-error.log
