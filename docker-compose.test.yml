# PHPUnit suites (unit + integration) in the same PHP 8.5 image the app uses.
# Run with: docker compose -f docker-compose.test.yml run --rm test
name: turtle-tests

services:
  mysql:
    image: mysql:8.0
    command: --log-error=/var/lib/mysql/mysql-error.log
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: turtle_test
      MYSQL_USER: turtle
      MYSQL_PASSWORD: turtle
    healthcheck:
      # -h 127.0.0.1 forces TCP: a socket ping succeeds during MySQL's init
      # phase while --skip-networking is active, before clients can connect.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 2s
      retries: 30
      timeout: 5s
    networks:
      - turtle-tests

  test:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./tests/empty.env:/var/www/html/.env:ro
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: turtle_test
      DB_USERNAME: turtle
      DB_PASSWORD: turtle
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - turtle-tests
    # Skip the app entrypoint (it starts Apache and a queue worker).
    entrypoint: []
    command: bash -c "composer install --no-interaction --no-progress && vendor/bin/phpunit"

networks:
  turtle-tests:
    driver: bridge
