services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - turtle-storage:/var/www/html/storage/uploads
      # Read-only so Settings -> Logging can show MySQL's error log.
      - mysql-data:/var/lib/mysql:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - turtle

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Keep the error log in the data volume (also mounted read-only into the
    # app) instead of only streaming it to container stdout.
    command: --log-error=/var/lib/mysql/mysql-error.log
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-turtle}
      - MYSQL_USER=${MYSQL_USER:-turtle}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-turtle}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      retries: 10
      timeout: 5s
    networks:
      - turtle

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP - loopback only; the app reaches it over the Compose network
      # Web UI defaults to loopback. Set MAILPIT_UI_BIND to a host LAN IP to
      # allow same-subnet access. Never set this to 0.0.0.0.
      - "${MAILPIT_UI_BIND:-127.0.0.1}:8025:8025"
    environment:
      # DNS-rebinding protection for named hosts. Loopback names, raw IPs and
      # the Compose DNS name below are always accepted by Mailpit.
      - MP_ALLOWED_HOSTS=${MAILPIT_ALLOWED_HOSTS:-mailpit}
    networks:
      - turtle

volumes:
  mysql-data:
  turtle-storage:

networks:
  turtle:
    driver: bridge
